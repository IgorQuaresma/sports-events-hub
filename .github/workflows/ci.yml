name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv venv .venv && uv pip install -e ".[dev]" pip-audit
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/pip-audit --progress-spinner off --skip-editable
      - run: .venv/bin/pytest -q
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/hub_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
